version: "3"

services:
  noghte_app:
    build: .
    image: noghte_server_app:1.0
    container_name: noghte_app
    volumes:
      - "./code:/code"

    env_file:
      - .env
    ports:
      - "8000:8000"
    command: bash "./bashes/run.sh"

    depends_on:
      - postgres_of_noghte_app

  postgres_of_noghte_app:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_USER: ${db_user}
      POSTGRES_DB: ${db_name}
